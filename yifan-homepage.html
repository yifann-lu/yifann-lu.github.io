<style>
:root{color-scheme:light;--bg:#f5f5f4;--text:#57534e;--heading:#1c1917;--line:#d6d3d1;--hover:#edebea;--muted:#78716c;--glass:rgba(245,245,244,.92)}
:root.dark{color-scheme:dark;--bg:#1c1917;--text:#d6d3d1;--heading:#fafaf9;--line:#44403c;--hover:#292524;--muted:#a8a29e;--glass:rgba(28,25,23,.92)}
*{box-sizing:border-box}html{overflow-y:scroll;scroll-padding-top:7rem}body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font:16px/1.75 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;overflow-wrap:anywhere;transition:background-color .18s,color .18s}a{color:inherit;text-decoration-color:var(--line);text-underline-offset:4px;transition:color .18s}a:hover{color:var(--heading);text-decoration-color:var(--muted)}button{font:inherit;color:inherit}a:focus-visible,button:focus-visible{outline:2px solid var(--heading);outline-offset:5px}.container{width:100%;max-width:640px;margin-inline:auto;padding-inline:20px}.skip{position:fixed;top:10px;left:20px;z-index:99;padding:8px 16px;background:var(--bg);transform:translateY(-160%)}.skip:focus{transform:none}.header{position:fixed;z-index:10;inset:0 0 auto;padding:20px 0;background:var(--glass);backdrop-filter:blur(8px)}.header-row{display:flex;align-items:center;justify-content:space-between;gap:12px 20px;flex-wrap:wrap}.brand{font-weight:600;text-decoration:none;letter-spacing:.015em}.navigation{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.navigation span{opacity:.35}.navigation a[aria-current=page]{color:var(--heading);text-decoration-color:var(--muted)}main{flex:1;padding:144px 0 112px}h1,h2,h3,p{margin:0}h1,h2,h3{font-weight:600;color:var(--heading)}h1,h2{font-size:16px}.intro{margin-top:24px;font-family:Georgia,"Noto Serif SC","Songti SC","STSong","SimSun",serif;font-size:17px;line-height:1.95}.intro p+p{margin-top:22px}.section{margin-top:64px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.empty{border:1px solid var(--line);border-radius:8px;padding:16px}.empty-title{font-weight:500}.empty p+p{margin-top:4px;color:var(--muted);font-size:14px;line-height:1.8}.list-heading{font-size:20px;margin-bottom:12px}.list-description{margin-bottom:36px}.content-list{list-style:none;padding:0;margin:0;display:grid;gap:16px}.card{display:flex;gap:20px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:8px;padding:12px 16px;text-decoration:none}.card:hover{background:var(--hover)}.card h3{font-size:16px;color:inherit}.card p{font-size:14px;color:var(--muted)}.card svg{width:20px;height:20px;flex-shrink:0}.year{margin-bottom:16px}.archive-group+.archive-group{margin-top:36px}.footer{padding:24px 0;font-size:14px}.footer-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.theme-switch{display:flex;gap:4px}.theme-switch button{display:grid;place-items:center;width:40px;height:40px;border:0;border-radius:50%;background:transparent;cursor:pointer}.theme-switch button:hover,.theme-switch button[aria-pressed=true]{background:var(--hover);color:var(--heading)}.theme-switch svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}.footer-links{display:flex;gap:16px;margin-top:12px}.page{animation:appear .35s ease-out}.back-top{position:fixed;bottom:24px;right:24px;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--bg);font-size:14px;cursor:pointer}.back-top[hidden]{display:none}@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@media(max-width:640px){.navigation{font-size:14px}}@media(max-width:380px){.navigation{width:100%}main{padding-top:160px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
<script>
(()=>{let theme="system";try{theme=localStorage.getItem("yifan-theme")||"system"}catch{}document.documentElement.classList.toggle("dark",theme==="dark"||(theme==="system"&&matchMedia("(prefers-color-scheme: dark)").matches))})();
</script>
</head>
<body>
<a class="skip" href="#main-content">跳到正文</a>
<header class="header"><div class="container header-row">
<a class="brand" href="#/" aria-label="卢一帆的首页">卢一帆</a>
<nav class="navigation" aria-label="主导航"><a href="#/projects" data-nav="projects">项目</a><span aria-hidden="true">/</span><a href="#/blog" data-nav="blog">技术文章</a><span aria-hidden="true">/</span><a href="#/essays" data-nav="essays">个人随笔</a></nav>
</div></header>
<main id="main-content"><div class="container" id="page">
<div class="page"><h1>你好，我是一帆 <span aria-hidden="true">👋</span></h1>
<div class="intro"><p>深圳大学计算机硕士在读，关注 AI Agent 与大模型应用。</p><p>这里放我做过的项目、技术上的实践和理解，也留一些关于阅读、生活和成长的随笔。</p></div>
<section class="section"><div class="section-head"><h2>项目</h2><a href="#/projects">查看全部</a></div><div class="empty"><p class="empty-title">项目正在整理中</p><p>一些从想法到实现的尝试，整理后会放在这里。</p></div></section>
<section class="section"><div class="section-head"><h2>技术文章</h2><a href="#/blog">查看全部</a></div><div class="empty"><p class="empty-title">技术笔记，慢慢积累</p><p>记录实践中遇到的问题，以及逐渐想明白的答案。</p></div></section>
<section class="section"><div class="section-head"><h2>个人随笔</h2><a href="#/essays">查看全部</a></div><div class="empty"><p class="empty-title">留一点空间，写生活</p><p>读过的书、走过的路，和一些还在生长的想法。</p></div></section>
</div></div></main>
<footer class="footer"><div class="container"><div class="footer-row"><div>© <span id="year">2026</span> | 卢一帆</div><div class="theme-switch" role="group" aria-label="页面外观">
<button type="button" data-theme="light" aria-label="浅色模式" title="浅色模式" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5"/><path d="M12 1v2m0 18v2M1 12h2m18 0h2M4.22 4.22l1.42 1.42m12.72 12.72 1.42 1.42M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg></button>
<button type="button" data-theme="dark" aria-label="深色模式" title="深色模式" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
<button type="button" data-theme="system" aria-label="跟随系统" title="跟随系统" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg></button>
</div></div><nav class="footer-links" aria-label="其他链接"><a href="https://github.com/yifann-lu" target="_blank" rel="noopener noreferrer">GitHub ↗</a></nav></div></footer>
<button class="back-top" type="button" id="back-top" hidden>↑ 返回顶部</button>
<script>
/* 这是可独立打开的前端页面。后续内容可填写在以下三组数据中。
   每条格式：{ title: "名称", description: "一句话介绍", date: "2026-09-11", url: "https://..." }
   项目、技术文章、个人随笔的数据分别放到 projects、blog、essays。 */
const CONTENT = { projects: [], blog: [], essays: [] };
const CATEGORIES = {
 projects:{title:"项目",description:"从想法到实现，记录做过的项目和过程。",empty:"项目正在整理中",note:"一些从想法到实现的尝试，整理后会放在这里。"},
 blog:{title:"技术文章",description:"关于 Agent、编程和技术实践的笔记。",empty:"技术笔记，慢慢积累",note:"记录实践中遇到的问题，以及逐渐想明白的答案。"},
 essays:{title:"个人随笔",description:"读书、生活，以及技术之外的想法。",empty:"留一点空间，写生活",note:"读过的书、走过的路，和一些还在生长的想法。"}
};
const page=document.getElementById("page");
function element(tag,text,className){const el=document.createElement(tag);if(text)el.textContent=text;if(className)el.className=className;return el}
function entries(key){return CONTENT[key].filter(item=>!item.draft).slice().sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")))}
function empty(title,description){const box=element("div",null,"empty");box.append(element("p",title,"empty-title"),element("p",description));return box}
function card(item){let url;try{url=new URL(item.url);if(!["http:","https:"].includes(url.protocol))throw Error()}catch{url=undefined}const el=element(url?"a":"div",null,"card");if(url){el.href=url.href;el.target="_blank";el.rel="noopener noreferrer"}const copy=element("div");copy.append(element("h3",item.title),element("p",item.description));el.append(copy);if(url){const arrow=element("span","›");arrow.setAttribute("aria-hidden","true");el.append(arrow)}return el}
function list(items){const ul=element("ul",null,"content-list");items.forEach(item=>{const li=element("li");li.append(card(item));ul.append(li)});return ul}
function render(){
 if(location.hash==="#main-content")return;
 const key=location.hash.replace(/^#\/?/,"").replace(/\/$/,"");const category=CATEGORIES[key];
 const view=element("div",null,"page");
 document.querySelectorAll("[data-nav]").forEach(link=>{if(link.dataset.nav===key)link.setAttribute("aria-current","page");else link.removeAttribute("aria-current")});
 if(category){
  document.title=category.title+" · 卢一帆";view.append(element("h1",category.title,"list-heading"),element("p",category.description,"list-description"));const items=entries(key);
  if(!items.length)view.append(empty("内容正在整理中","有新的记录，会放在这里。"));
  else{const groups=new Map();items.forEach(item=>{const year=String(item.date||"未注明日期").slice(0,4);if(!groups.has(year))groups.set(year,[]);groups.get(year).push(item)});for(const [year,items] of groups){const section=element("section",null,"archive-group");section.append(element("h2",year,"year"),list(items));view.append(section)}}
 }else{
  document.title="首页 · 卢一帆";view.append(element("h1","你好，我是一帆 👋"));const intro=element("div",null,"intro");intro.append(element("p","深圳大学计算机硕士在读，关注 AI Agent 与大模型应用。"),element("p","这里放我做过的项目、技术上的实践和理解，也留一些关于阅读、生活和成长的随笔。"));view.append(intro);
  for(const [id,category] of Object.entries(CATEGORIES)){const section=element("section",null,"section");const head=element("div",null,"section-head");const link=element("a","查看全部");link.href="#/"+id;link.setAttribute("aria-label","查看全部"+category.title);head.append(element("h2",category.title),link);section.append(head);const items=entries(id).slice(0,3);section.append(items.length?list(items):empty(category.empty,category.note));view.append(section)}
 }
 page.replaceChildren(view);window.scrollTo(0,0);
}
window.addEventListener("hashchange",render);render();
document.getElementById("year").textContent=new Date().getFullYear();
let preference="system";try{preference=localStorage.getItem("yifan-theme")||"system"}catch{}
const media=matchMedia("(prefers-color-scheme: dark)");
function paint(){document.documentElement.classList.toggle("dark",preference==="dark"||(preference==="system"&&media.matches));document.querySelectorAll("[data-theme]").forEach(button=>button.setAttribute("aria-pressed",String(button.dataset.theme===preference)))}
document.querySelectorAll("[data-theme]").forEach(button=>button.addEventListener("click",()=>{preference=button.dataset.theme;try{localStorage.setItem("yifan-theme",preference)}catch{}paint()}));media.addEventListener("change",paint);paint();
const back=document.getElementById("back-top");window.addEventListener("scroll",()=>{back.hidden=window.scrollY<250},{passive:true});back.addEventListener("click",()=>window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"}));
</script>
</body>
</html>
